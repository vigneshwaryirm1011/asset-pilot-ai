#server
server.address = 127.0.0.1
server.port = 8081

# name
spring.application.name = assetpilot

#database
spring.datasource.url = jdbc:h2:file:./data/orders;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=5000
spring.datasource.username = admin
spring.datasource.password =

#jpa
#system smaller so it doesn't overload the database, and faster to admit when it's busy so users aren't left staring at a frozen screen forever.
# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Credentials from environment variables
app.admin-password=${APP_ADMIN_PASSWORD}
app.user-password=${APP_USER_PASSWORD}